name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-east1
  ARTIFACT_REGISTRY_REPO: concurrency-lab
  CLOUD_SQL_CONNECTION: notification-system-lab:asia-east1:concurrency-lab-db

jobs:
  deploy-mvc:
    name: Deploy lab-mvc
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Java 21 (Setup Java)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 編譯 MVC 模組 (Maven Build)
        run: mvn clean package -pl lab-mvc -am -DskipTests

      - name: 認證到 GCP (GCP Auth)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 設定 Docker 認證 (Docker Auth)
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 建立與推送 Docker 映像檔 (Build and Push)
        run: |
          IMAGE_NAME=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/lab-mvc:${{ github.sha }}
          docker build --build-arg MODULE_NAME=lab-mvc -t $IMAGE_NAME .
          docker push $IMAGE_NAME
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: 部署到 Cloud Run (Deploy)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: concurrency-lab-mvc
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/lab-mvc:${{ github.sha }}
          flags: |
            --no-allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --add-cloudsql-instances=${{ env.CLOUD_SQL_CONNECTION }}
            --vpc-connector=vpc-con
            --set-env-vars=SPRING_PROFILES_ACTIVE=cloudrun,SERVER_PORT=8080,REDIS_HOST=${{ secrets.REDIS_HOST }},CLOUD_SQL_INSTANCE=notification-system-lab:asia-east1:concurrency-lab-db,DB_USERNAME=${{ secrets.DB_USERNAME }},DB_PASSWORD=${{ secrets.DB_PASSWORD }}

  deploy-webflux:
    name: Deploy lab-webflux
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Java 21 (Setup Java)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 編譯 WebFlux 模組 (Maven Build)
        run: mvn clean package -pl lab-webflux -am -DskipTests

      - name: 認證到 GCP (GCP Auth)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 設定 Docker 認證 (Docker Auth)
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 建立與推送 Docker 映像檔 (Build and Push)
        run: |
          IMAGE_NAME=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/lab-webflux:${{ github.sha }}
          docker build --build-arg MODULE_NAME=lab-webflux -t $IMAGE_NAME .
          docker push $IMAGE_NAME
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: 部署到 Cloud Run (Deploy)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: concurrency-lab-webflux
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/lab-webflux:${{ github.sha }}
          flags: |
            --no-allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --add-cloudsql-instances=${{ env.CLOUD_SQL_CONNECTION }}
            --vpc-connector=vpc-con
            --set-env-vars=SPRING_PROFILES_ACTIVE=cloudrun,SERVER_PORT=8080,REDIS_HOST=${{ secrets.REDIS_HOST }},CLOUD_SQL_INSTANCE=notification-system-lab:asia-east1:concurrency-lab-db,DB_USERNAME=${{ secrets.DB_USERNAME }},DB_PASSWORD=${{ secrets.DB_PASSWORD }}
