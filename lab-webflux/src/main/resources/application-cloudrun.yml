# Cloud Run 環境專用設定
spring:
  config:
    activate:
      on-profile: cloudrun

  cloud:
    gcp:
      project-id: notification-system-lab

  r2dbc:
    url: r2dbc:postgresql:///${CLOUD_SQL_INSTANCE}/lab_db?socketFactory=com.google.cloud.sql.postgres.SocketFactory
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 2
      max-size: 5
      max-create-connection-time: 2s

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

management:
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

server:
  port: 8080
